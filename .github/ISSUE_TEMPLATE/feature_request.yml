name: Feature request
description: Suggest an improvement or a new capability.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please skim the [roadmap issues](https://github.com/Shman4ik/pgNimbus/issues?q=is%3Aissue%20is%3Aopen%20label%3Aroadmap)
        first — a lot of planned work is already tracked there. If your idea is
        one of them, comment on that issue instead of opening a new one. Ideas
        not validated yet are listed under P3 in
        [ROADMAP.md](https://github.com/Shman4ik/pgNimbus/blob/main/ROADMAP.md#p3-validate-before-committing);
        for one of those, a new issue that links its line registers demand.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the workflow that's currently painful or impossible, not just the feature itself.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would it look like? How do other clients (psql, TablePlus, DBeaver…) handle it, if they do?
    validations:
      required: false
