version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      # Avalonia packages version-lockstep with each other; one PR per bump.
      avalonia:
        patterns:
          - "Avalonia*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Action bumps are reviewed the same way whichever action moved; one PR
      # (and one CI run) per week instead of one per action.
      actions:
        patterns:
          - "*"
