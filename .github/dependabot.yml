version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      # Avalonia packages version-lockstep with each other; one PR per bump.
      avalonia:
        patterns:
          - "Avalonia*"

  # Every `uses:` in .github/workflows and .github/actions is pinned to a
  # commit SHA with a "# vX.Y.Z" comment (security audit 2026-09, finding 5);
  # this is what moves the SHA and the comment together when a new release
  # of an action appears. The nuget entry above also covers the tool manifest
  # (.config/dotnet-tools.json: wix, CycloneDX).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Action bumps are reviewed the same way whichever action moved; one PR
      # (and one CI run) per week instead of one per action.
      actions:
        patterns:
          - "*"
