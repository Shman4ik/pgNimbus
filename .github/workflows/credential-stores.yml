name: Native credential stores

# Three OS runners (one of them macOS) for a test filter that only exercises
# the native credential stores, so it runs only when something those stores
# are built from changes. Not a required check, which is what makes a path
# filter safe here: a skipped run never leaves a PR waiting on it.
on:
  pull_request:
    paths:
      - "PgNimbus.Core/Connections/**"
      - "PgNimbus.Core.Tests/Connections/CredentialStoreTests.cs"
      - "PgNimbus.Core/PgNimbus.Core.csproj"
      - "PgNimbus.Core.Tests/PgNimbus.Core.Tests.csproj"
      - "Directory.Build.props"
      - "global.json"
      - ".github/workflows/credential-stores.yml"
  push:
    branches: [main]
    paths:
      - "PgNimbus.Core/Connections/**"
      - "PgNimbus.Core.Tests/Connections/CredentialStoreTests.cs"
      - "PgNimbus.Core/PgNimbus.Core.csproj"
      - "PgNimbus.Core.Tests/PgNimbus.Core.Tests.csproj"
      - "Directory.Build.props"
      - "global.json"
      - ".github/workflows/credential-stores.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: credential-stores-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  native-store:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PGNIMBUS_TEST_CREDENTIAL_STORE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - name: Prepare isolated macOS keychain
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p ci-test-only "$RUNNER_TEMP/pgnimbus-tests.keychain-db"
          security default-keychain -s "$RUNNER_TEMP/pgnimbus-tests.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/pgnimbus-tests.keychain-db"
          security unlock-keychain -p ci-test-only "$RUNNER_TEMP/pgnimbus-tests.keychain-db"
      - name: Install Linux Secret Service
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libsecret-1-0 gnome-keyring dbus-x11
      - name: Test Linux credentials in isolated D-Bus session
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- sh -ec 'printf "\n" | gnome-keyring-daemon --unlock --components=secrets; dotnet test --project PgNimbus.Core.Tests -- --treenode-filter "/*/*/CredentialStoreTests/*"'
      - name: Test macOS and Windows credentials
        if: runner.os != 'Linux'
        run: dotnet test --project PgNimbus.Core.Tests -- --treenode-filter "/*/*/CredentialStoreTests/*"
      - name: Test locked macOS Keychain fallback
        timeout-minutes: 2
        if: runner.os == 'macOS'
        env:
          PGNIMBUS_TEST_CREDENTIAL_STORE_UNAVAILABLE: "1"
        run: |
          security lock-keychain "$RUNNER_TEMP/pgnimbus-tests.keychain-db"
          dotnet test --no-build --project PgNimbus.Core.Tests -- --treenode-filter "/*/*/CredentialStoreTests/Unavailable_native_store_uses_session_memory"
      - name: Test unavailable Linux Secret Service fallback
        if: runner.os == 'Linux'
        env:
          PGNIMBUS_TEST_CREDENTIAL_STORE_UNAVAILABLE: "1"
          DBUS_SESSION_BUS_ADDRESS: unix:path=/tmp/pgnimbus-nonexistent-test-bus
        run: dotnet test --no-build --project PgNimbus.Core.Tests -- --treenode-filter "/*/*/CredentialStoreTests/Unavailable_native_store_uses_session_memory"
      - name: Remove test keychain
        if: always() && runner.os == 'macOS'
        run: security delete-keychain "$RUNNER_TEMP/pgnimbus-tests.keychain-db"
