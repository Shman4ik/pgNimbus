name: Benchmarks

# Measures the headline performance numbers (startup time, memory, binary
# size, query-engine latency/throughput) as part of the release pipeline
# (release.yml calls this as a reusable workflow), so a regression shows up
# against a real tagged build instead of on every PR. Results land in the
# job summary, a downloadable artifact, and — for actual tag-triggered
# releases — the gh-pages benchmark history (charts at
# https://shman4ik.github.io/pgNimbus/dev/bench/).
#
# Also runnable standalone via workflow_dispatch for ad hoc measurement.
#
# Shared runners are noisy: treat the trend and big jumps as signal, not
# single-digit-percent wiggles between runs.
on:
  workflow_call:
    inputs:
      record_history:
        description: "Push results to the gh-pages benchmark history"
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      record_history:
        description: "Push results to the gh-pages benchmark history"
        type: boolean
        default: false

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    # contents: write is for the gh-pages history push on real releases; the
    # caller job's permissions cap what's actually granted.
    permissions:
      contents: write

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # Xvfb: the startup benchmark opens a real window. clang/zlib are the
      # NativeAOT publish prerequisites (usually preinstalled on the runner,
      # but cheap to make explicit).
      - name: Install benchmark dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb clang zlib1g-dev

      - name: Run benchmarks
        run: scripts/benchmarks/run-benchmarks.sh
        env:
          PGNIMBUS_BENCH_CONN: "Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres"

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: bench-results
          path: bench-results/

      # Real tag-triggered releases append to the benchmark history on
      # gh-pages (./dev/bench), which renders per-metric trend charts.
      # workflow_dispatch test runs skip this by default — they only get the
      # job-summary table above, unless record_history is explicitly set.
      #
      # continue-on-error: this is best-effort history bookkeeping, not the
      # point of the job — a gh-pages push hiccup (e.g. a race between two
      # concurrent releases) shouldn't mark the whole benchmark job failed
      # when the actual measurements above already succeeded.
      - name: Record benchmark history
        if: inputs.record_history
        continue-on-error: true
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: pgNimbus benchmarks
          tool: customSmallerIsBetter
          output-file-path: bench-results/benchmarks.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          # Shared-runner noise: only flag genuinely large regressions, as a
          # job-summary alert rather than a commit comment.
          alert-threshold: "150%"
          comment-on-alert: false
          fail-on-alert: false
