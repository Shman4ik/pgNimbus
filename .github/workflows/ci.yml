name: CI

# The PR/push quality gate: does it build, do the tests pass. Release
# packaging lives in release.yml (tag-triggered) — this stays fast and
# runs on every change instead.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# A newer push supersedes whatever was still running for the same branch, so a
# force-push burst leaves one run instead of five — and one screenshots
# artifact instead of five. The head ref (not github.ref) is the key on
# purpose: a branch push and the pull_request run of that same branch would
# otherwise land in different groups and never cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  # Blocks PRs that add a package with a known vulnerability (GitHub Advisory
  # Database via the repo dependency graph). Complements NuGetAudit in
  # Directory.Build.props, which fails the build on advisories in packages
  # already referenced.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned to a release commit: "v5" is a branch of this action.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  build-test:
    runs-on: ubuntu-latest
    # A green run takes ~3 minutes. Without a cap a hung test holds the runner
    # for GitHub's default of six hours.
    timeout-minutes: 20

    # QueryEngineReconnectTests kills real backends (pg_terminate_backend) to
    # exercise auto-reconnect end to end; PGNIMBUS_TEST_CONN below points them
    # at this container instead of the mocks/pure-logic tests everything else
    # uses. Mirrors the services block in benchmark.yml.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Build (Release)
        run: dotnet build -c Release

      # pg_dump and pg_restore for the backup round trips (BackupServiceLiveTests).
      # pg_dump has to be at least as new as the postgres:17 service, and the
      # runner's own PostgreSQL is older, so the client comes from PGDG, the way
      # the backup window's install steps tell an Ubuntu user to get it.
      - name: Install PostgreSQL client programs
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18

      # TUnit on Microsoft.Testing.Platform — "dotnet test --project" works
      # via the test.runner opt-in in the repo-root global.json.
      # PGNIMBUS_TEST_PG_TOOLS makes the backup tests require that install (a
      # broken one fails the build instead of skipping the round trip), and the
      # automatic search is checked to find it on its own.
      - name: Test (core)
        env:
          PGNIMBUS_TEST_CONN: "Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres"
          PGNIMBUS_TEST_PG_TOOLS: /usr/lib/postgresql/18/bin
        run: dotnet test --project tests/PgNimbus.Core.Tests -c Release --no-build

      # The UI half: real windows on Avalonia's headless platform, driven with
      # real key input. No display and no database — the fixture data source
      # opens no socket. This is the check that used to be a person clicking
      # through the app before a release.
      - name: Test (UI)
        run: dotnet test --project tests/PgNimbus.App.Tests -c Release --no-build

      # Renders every UI scenario through Avalonia.Headless (no display, no
      # database — see CLAUDE.md "Headless screenshot harness") and compares each
      # frame against its committed baseline. Two failures are caught here: a
      # view that throws while loading or renders no frame at all, and a view
      # that renders something *different* from what was signed off. The second
      # is the one that used to reach a release, because a PNG artifact nobody
      # opens is not a check.
      #
      # Baselines are pixel data and only comparable against the OS that made
      # them, which is why this job pins to ubuntu-latest and why refreshing
      # them goes through scripts/screenshots/update-baselines.sh (Docker on a
      # non-Linux machine) or the screenshots.yml workflow.
      - name: Screenshots (visual regression)
        run: >
          dotnet run --project tools/Screenshot -c Release --no-build --
          "$RUNNER_TEMP/screenshots"
          --baseline tools/Screenshot/baselines

      # if: failure() — on a mismatch the diff images the run just wrote are the
      # whole point of looking at the artifact. On a green run they are, by
      # definition, the committed baselines again, and nobody has ever
      # downloaded them: uploading ~3 MB per push kept ~50 identical copies
      # alive against a 0.5 GB Actions storage allowance. Kept short for the
      # same reason — a visual diff is looked at while the PR is open or not
      # at all.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
          retention-days: 7
