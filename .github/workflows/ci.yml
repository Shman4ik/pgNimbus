name: CI

# The PR/push quality gate: does it build, do the tests pass. Release
# packaging lives in release.yml (tag-triggered) — this stays fast and
# runs on every change instead.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  # Blocks PRs that add a package with a known vulnerability (GitHub Advisory
  # Database via the repo dependency graph). Complements NuGetAudit in
  # Directory.Build.props, which fails the build on advisories in packages
  # already referenced.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate

  build-test:
    runs-on: ubuntu-latest

    # QueryEngineReconnectTests kills real backends (pg_terminate_backend) to
    # exercise auto-reconnect end to end; PGNIMBUS_TEST_CONN below points them
    # at this container instead of the mocks/pure-logic tests everything else
    # uses. Mirrors the services block in benchmark.yml.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # Debug first: it's the configuration that includes the Debug-only
      # AvaloniaUI.DiagnosticsSupport reference, so both dependency graphs
      # get compiled.
      - name: Build (Debug)
        run: dotnet build -c Debug

      - name: Build (Release)
        run: dotnet build -c Release

      # TUnit on Microsoft.Testing.Platform — "dotnet test --project" works
      # via the test.runner opt-in in the repo-root global.json.
      - name: Test
        env:
          PGNIMBUS_TEST_CONN: "Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres"
        run: dotnet test --project PgNimbus.Core.Tests -c Release

      # Renders every UI scenario through Avalonia.Headless (no display, no
      # database — see CLAUDE.md "Headless screenshot harness"). It doubles as a
      # smoke test: a view that throws while loading, or one that renders no
      # frame at all, fails the run instead of shipping quietly. The PNGs ride
      # along as an artifact so a UI change can be eyeballed from the PR.
      - name: Screenshots
        run: dotnet run --project tools/Screenshot -c Release -- "${{ runner.temp }}/screenshots"

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
