name: Release

# Tag pushes (v1.2.3) cut a real GitHub Release; workflow_dispatch runs the
# whole pipeline without publishing anything, for testing.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (no leading v), e.g. 1.2.3. Defaults to a dev version."
        required: false
        type: string

permissions:
  contents: write

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="0.0.0-ci.${{ github.run_number }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

  build-windows:
    needs: prepare
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish NativeAOT (win-x64)
        run: >
          dotnet publish PgNimbus.App -c Release -r win-x64
          --self-contained true
          -p:PublishAot=true
          -p:Version=${{ env.VERSION }}
          -p:FileVersion=${{ env.VERSION }}
          -p:InformationalVersion=${{ env.VERSION }}
          -o publish/win-x64

      - name: Install WiX
        run: dotnet tool install --global wix --version 5.*

      - name: Build MSI
        # PublishDir/IconFile must be absolute: WiX resolves relative -d
        # paths against the .wxs file's own directory, not the cwd.
        run: >
          wix build installer/windows/Product.wxs
          -d PublishDir=${{ github.workspace }}\publish\win-x64
          -d Version=${{ env.VERSION }}
          -d IconFile=${{ github.workspace }}\PgNimbus.App\Assets\app.ico
          -arch x64
          -o pgNimbus-${{ env.VERSION }}-win-x64.msi

      - name: Compute SHA256
        id: sha
        shell: pwsh
        run: |
          $hash = (Get-FileHash "pgNimbus-${{ env.VERSION }}-win-x64.msi" -Algorithm SHA256).Hash.ToLower()
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        with:
          name: windows-msi
          path: pgNimbus-${{ env.VERSION }}-win-x64.msi

      - name: Build MSIX (for Microsoft Store submission)
        # Self-signed for upload only — Store re-signs with its own trusted
        # certificate during certification (see scripts/windows/build-msix.ps1).
        # Not part of the public GitHub Release: a self-signed MSIX can't be
        # installed without the user trusting the cert first, so this is a
        # CI-only artifact — download it from the workflow run and upload to
        # Partner Center. See CLAUDE.md "Microsoft Store (MSIX)".
        shell: pwsh
        run: >
          scripts/windows/build-msix.ps1
          -PublishDir publish/win-x64
          -Version ${{ env.VERSION }}
          -Output pgNimbus-${{ env.VERSION }}-win-x64.msix

      - uses: actions/upload-artifact@v7
        with:
          name: windows-msix
          path: pgNimbus-${{ env.VERSION }}-win-x64.msix

    outputs:
      msi_sha256: ${{ steps.sha.outputs.sha256 }}

  build-macos:
    # Apple Silicon only: GitHub retired the last Intel macOS runner image
    # (macos-13) in December 2025, and has said x86_64 macOS support ends
    # entirely after the macos-15 image retires (Fall 2027). There's no
    # GitHub-hosted way to build osx-x64 anymore, and virtually all Macs
    # sold since 2020 are Apple Silicon anyway.
    needs: prepare
    runs-on: macos-14
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Select pre-Xcode-26 toolchain
        # Xcode 26 changed Swift auto-linking in a way that breaks NativeAOT's
        # static link of libSystem.Security.Cryptography.Native.Apple.a ("symbol(s)
        # not found for architecture arm64" / pal_swiftbindings). Closed as
        # "not planned" upstream: https://github.com/dotnet/runtime/issues/116448.
        # Pin to the newest Xcode below 26 that the runner image has installed.
        run: |
          echo "Installed Xcode apps:"
          ls -d /Applications/Xcode_*.app 2>/dev/null || true

          best=""
          best_major=0
          for app in /Applications/Xcode_*.app; do
            [ -d "$app" ] || continue
            ver="$(basename "$app" .app | sed 's/Xcode_//')"
            major="${ver%%.*}"
            case "$major" in ''|*[!0-9]*) continue ;; esac
            if [ "$major" -lt 26 ] && [ "$major" -gt "$best_major" ]; then
              best_major="$major"
              best="$app"
            fi
          done

          if [ -n "$best" ]; then
            echo "Selecting $best"
            sudo xcode-select -s "$best/Contents/Developer"
          else
            echo "No Xcode <26 install found; continuing with the default (may fail, see comment above)"
          fi
          xcodebuild -version

      - name: Publish NativeAOT (osx-arm64)
        run: >
          dotnet publish PgNimbus.App -c Release -r osx-arm64
          --self-contained true
          -p:PublishAot=true
          -p:Version=${{ env.VERSION }}
          -p:FileVersion=${{ env.VERSION }}
          -p:InformationalVersion=${{ env.VERSION }}
          -o publish/osx-arm64

      - name: Build .app bundle + .dmg
        run: |
          chmod +x scripts/macos/build-app-bundle.sh
          ./scripts/macos/build-app-bundle.sh publish/osx-arm64 "$VERSION" osx-arm64 dist

      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmg-arm64
          path: dist/*.dmg

  winget-manifest:
    needs: [prepare, build-windows]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: windows-msi
          path: artifacts

      - name: Render winget manifests
        shell: bash
        run: |
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/pgNimbus-${VERSION}-win-x64.msi"
          chmod +x scripts/winget/render-manifest.sh
          ./scripts/winget/render-manifest.sh "$VERSION" "${{ needs.build-windows.outputs.msi_sha256 }}" "$RELEASE_URL" manifests

      - name: Validate manifests
        shell: pwsh
        run: winget validate --manifest manifests

      - name: Zip manifests
        shell: pwsh
        run: Compress-Archive -Path manifests\* -DestinationPath winget-manifests.zip

      - uses: actions/upload-artifact@v7
        with:
          name: winget-manifests
          path: winget-manifests.zip

  release:
    needs: [prepare, build-windows, build-macos, winget-manifest]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.msi *.dmg *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.msi
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          # Every build is unsigned until a code-signing cert / Apple
          # Developer account is added — flip this off once that lands.
          prerelease: true
