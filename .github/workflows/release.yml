name: Release

# A tag push (v1.2.3) cuts a real GitHub Release. A workflow_dispatch run builds
# and smoke-tests every package but publishes nothing, whichever ref it is
# started from: the "release" job and the benchmark history both gate on the
# event being a push, because a dispatch with a tag chosen under "Use workflow
# from" also carries github.ref = refs/tags/v…, and used to publish.
#
# Trust boundaries (security audit 2026-09, findings 5 and 15):
#   - The workflow token is read-only. Only the "release" job (assets,
#     attestations) and the benchmark call (gh-pages history) get
#     contents: write, and no checkout persists the token into .git/config, so
#     the MSBuild tasks of ~35 packages, the packaging tools and the
#     smoke-launched app never hold one.
#   - Every action is pinned to a commit SHA; the "# vX.Y.Z" comment beside
#     each is what Dependabot (github-actions ecosystem) bumps. The release
#     itself is created with the preinstalled gh CLI, so no third-party code
#     runs next to id-token: write.
#   - Each build job first checks that the built commit is on main: a tag can
#     be pushed on any commit, and the attestation only proves "built by this
#     workflow", not "built from a reviewed commit".
#
# Each build job resolves the version itself via .github/actions/version
# (a composite action) — no dedicated "prepare" job, so no extra runner
# boot at the head of the critical path.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (no leading v), e.g. 1.2.3. Defaults to a dev version."
        required: false
        type: string

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  # Chained after build-linux so it reuses that job's linux-x64 NativeAOT
  # publish instead of doing the same slow publish a second time. This does
  # not delay the release: the "release" job doesn't depend on benchmark.
  benchmark:
    needs: build-linux
    uses: ./.github/workflows/benchmark.yml
    # The one job besides "release" with write access: the gh-pages history
    # push. The benchmark action pushes through its github-token input, not a
    # persisted checkout credential.
    permissions:
      contents: write
    with:
      # Only append to the gh-pages trend history on a real tag push, never on
      # a workflow_dispatch run (even one started from a tag).
      record_history: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
      publish_artifact: publish-linux-x64

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the on-main check below can see origin/main. Nothing
          # in this job pushes, so the token has no business in .git/config.
          fetch-depth: 0
          persist-credentials: false

      - name: Require the built commit to be on main
        uses: ./.github/actions/require-on-main

      - name: Determine version
        uses: ./.github/actions/version
        with:
          version: ${{ inputs.version }}

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish NativeAOT (win-x64)
        shell: bash
        run: >
          dotnet publish src/PgNimbus.App -c Release -r win-x64
          --self-contained true
          -p:PublishAot=true
          -p:Version="$VERSION"
          -p:FileVersion="$VERSION"
          -p:InformationalVersion="$VERSION"
          -o publish/win-x64

      # Smoke the binary before packaging it, so a NativeAOT failure is
      # distinguishable from an installer failure at a glance.
      - name: Smoke test (publish output)
        shell: pwsh
        run: >
          scripts/release/Smoke-Launch.ps1
          -Label "win-x64 publish output"
          -Executable publish/win-x64/PgNimbus.App.exe

      # The direct Windows download is a portable .zip, not an installer
      # (2026-10): the per-user MSI was downloaded a handful of times in 30
      # releases, and the Store package covers installing and updating. Nothing
      # to install means nothing to sign, upgrade or uninstall here either.
      - name: Build portable zip
        shell: pwsh
        run: >
          scripts/windows/build-zip.ps1
          -PublishDir publish/win-x64
          -Version ${env:VERSION}
          -Output pgNimbus-${env:VERSION}-win-x64.zip

      # Launch it the way its users get it: unpacked into a fresh folder.
      - name: Smoke test (unpack the zip, launch it)
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "zip-smoke"
          Expand-Archive -Path "pgNimbus-${env:VERSION}-win-x64.zip" -DestinationPath $dest -Force
          $exe = Join-Path $dest "pgNimbus-${env:VERSION}-win-x64\PgNimbus.App.exe"
          scripts/release/Smoke-Launch.ps1 -Label "unpacked zip" -Executable $exe
          $pdb = Get-ChildItem -Path $dest -Filter *.pdb -Recurse
          if ($pdb) { throw "debug symbols shipped in the zip: $($pdb.Name -join ', ')" }

      - name: Compute SHA256
        id: sha
        shell: pwsh
        run: |
          $hash = (Get-FileHash "pgNimbus-${env:VERSION}-win-x64.zip" -Algorithm SHA256).Hash.ToLower()
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-zip
          path: pgNimbus-${{ env.VERSION }}-win-x64.zip
          # Handed straight to the "release" job below, which publishes it as a
          # GitHub Release asset — and Release assets do not count against the
          # Actions storage allowance. So this copy is a same-run hand-off, not
          # a keepsake; the 90-day default kept a second copy of every package
          # ever built. A workflow_dispatch test run (no "release" job) still
          # leaves it downloadable for the rest of the day.
          retention-days: 1

      - name: Build MSIX (for Microsoft Store submission)
        # Self-signed for upload only — Store re-signs with its own trusted
        # certificate during certification (see scripts/windows/build-msix.ps1).
        # Not part of the public GitHub Release: a self-signed MSIX can't be
        # installed without the user trusting the cert first, so this is a
        # CI-only artifact — download it from the workflow run and upload to
        # Partner Center. See CLAUDE.md "Microsoft Store (MSIX)".
        shell: pwsh
        run: >
          scripts/windows/build-msix.ps1
          -PublishDir publish/win-x64
          -Version ${env:VERSION}
          -Output pgNimbus-${env:VERSION}-win-x64.msix

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-msix
          path: pgNimbus-${{ env.VERSION }}-win-x64.msix
          # The one build artifact with no Release asset behind it: Partner Center
          # submission is a manual download-and-upload step (see CLAUDE.md,
          # "Microsoft Store (MSIX)"), so it has to outlive the run. Two weeks is
          # long enough for that and short enough that a ~25 MB package is not
          # held 90 days per release.
          retention-days: 14

      # winget manifests are rendered right here rather than in a separate
      # job: the zip and its SHA256 are already at hand, so this saves a
      # whole extra Windows runner (and the artifact round-trip) that used
      # to sit on the critical path before "release".
      - name: Render winget manifests
        shell: bash
        env:
          ZIP_SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/pgNimbus-${VERSION}-win-x64.zip"
          bash scripts/winget/render-manifest.sh "$VERSION" "$ZIP_SHA256" "$RELEASE_URL" manifests

      - name: Validate winget manifests
        shell: pwsh
        run: winget validate --manifest manifests

      - name: Zip winget manifests
        shell: pwsh
        run: Compress-Archive -Path manifests\* -DestinationPath winget-manifests.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: winget-manifests
          path: winget-manifests.zip
          # Same-run hand-off to "release" (see windows-zip above).
          retention-days: 1

  build-macos:
    # Apple Silicon only: GitHub retired the last Intel macOS runner image
    # (macos-13) in December 2025, and has said x86_64 macOS support ends
    # entirely after the macos-15 image retires (Fall 2027). There's no
    # GitHub-hosted way to build osx-x64 anymore, and virtually all Macs
    # sold since 2020 are Apple Silicon anyway.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the built commit to be on main
        uses: ./.github/actions/require-on-main

      - name: Determine version
        uses: ./.github/actions/version
        with:
          version: ${{ inputs.version }}

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Select pre-Xcode-26 toolchain
        # Xcode 26 changed Swift auto-linking in a way that breaks NativeAOT's
        # static link of libSystem.Security.Cryptography.Native.Apple.a ("symbol(s)
        # not found for architecture arm64" / pal_swiftbindings). Closed as
        # "not planned" upstream: https://github.com/dotnet/runtime/issues/116448.
        # Pin to the newest Xcode below 26 that the runner image has installed.
        run: |
          echo "Installed Xcode apps:"
          ls -d /Applications/Xcode_*.app 2>/dev/null || true

          best=""
          best_major=0
          for app in /Applications/Xcode_*.app; do
            [ -d "$app" ] || continue
            ver="$(basename "$app" .app | sed 's/Xcode_//')"
            major="${ver%%.*}"
            case "$major" in ''|*[!0-9]*) continue ;; esac
            if [ "$major" -lt 26 ] && [ "$major" -gt "$best_major" ]; then
              best_major="$major"
              best="$app"
            fi
          done

          if [ -n "$best" ]; then
            echo "Selecting $best"
            sudo xcode-select -s "$best/Contents/Developer"
          else
            echo "No Xcode <26 install found; continuing with the default (may fail, see comment above)"
          fi
          xcodebuild -version

      - name: Publish NativeAOT (osx-arm64)
        run: >
          dotnet publish src/PgNimbus.App -c Release -r osx-arm64
          --self-contained true
          -p:PublishAot=true
          -p:Version="$VERSION"
          -p:FileVersion="$VERSION"
          -p:InformationalVersion="$VERSION"
          -o publish/osx-arm64

      - name: Smoke test (publish output)
        run: |
          chmod +x scripts/release/smoke-launch.sh
          ./scripts/release/smoke-launch.sh "osx-arm64 publish output" publish/osx-arm64/PgNimbus.App

      - name: Build .app bundle + .dmg
        run: |
          chmod +x scripts/macos/build-app-bundle.sh
          ./scripts/macos/build-app-bundle.sh publish/osx-arm64 "$VERSION" osx-arm64 dist

      # Mount the .dmg and launch the bundled binary the way a user would get
      # it, so a broken bundle layout (a missing Info.plist key, an executable
      # left out of MacOS/) fails here rather than on someone's desktop.
      - name: Smoke test (mounted .dmg)
        run: |
          dmg=$(ls dist/*.dmg | head -1)
          mount_point=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_point"
          trap 'hdiutil detach "$mount_point" -quiet || true' EXIT

          # hdiutil's treatment of a .app passed as -srcfolder decides whether
          # the bundle lands at the volume root or its contents do; find it
          # either way rather than encoding a guess into the gate.
          app=$(find "$mount_point" -maxdepth 1 -name '*.app' | head -1)
          [ -n "$app" ] || app="$mount_point"
          ls -la "$mount_point"

          # The drag-to-install target. Without it the only gesture the window
          # offers is double-clicking the app on the read-only image.
          [ -L "$mount_point/Applications" ] || {
            echo "::error::.dmg is missing the /Applications symlink" >&2
            exit 1
          }

          # The signature is what decides whether Gatekeeper calls a quarantined
          # download "damaged" (unrecoverable without a Terminal command) or
          # "cannot be checked for malicious software" (right-click -> Open
          # clears it). Verify it survived hdiutil, not just codesign.
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | tee /tmp/codesign.txt
          grep -q 'Signature=adhoc' /tmp/codesign.txt || {
            echo "::error::app bundle in the .dmg is not signed" >&2
            exit 1
          }

          # Debug symbols must not ship. `*.dSYM` is 130 MB and the script's own
          # cleanup once missed it on a case-sensitive glob.
          stray=$(find "$app" \( -iname '*.dsym' -o -name '*.pdb' \))
          [ -z "$stray" ] || {
            echo "::error::debug symbols shipped in the .app: $stray" >&2
            exit 1
          }

          # The plist must not promise an older macOS than the code was built for:
          # below a Mach-O's minos, dyld refuses to load it with no explanation.
          required=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")
          highest=$(find "$app/Contents/MacOS" -type f \( -perm -u+x -o -name '*.dylib' \) \
            -exec vtool -show-build {} \; 2>/dev/null | awk '/minos/ {print $2}' | sort -V | tail -1)
          echo "Info.plist LSMinimumSystemVersion=$required, highest Mach-O minos=$highest"
          [ -n "$highest" ] || { echo "::error::could not read minos from any binary" >&2; exit 1; }
          [ "$(printf '%s\n%s\n' "$required" "$highest" | sort -V | tail -1)" = "$required" ] || {
            echo "::error::LSMinimumSystemVersion $required is older than the binaries' minos $highest" >&2
            exit 1
          }

          ./scripts/release/smoke-launch.sh "mounted .dmg" "$app/Contents/MacOS/PgNimbus.App"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-dmg-arm64
          path: dist/*.dmg
          # Same-run hand-off to "release" (see windows-zip above).
          retention-days: 1

  build-linux:
    strategy:
      matrix:
        include:
          # arm64 is a native build — GitHub provides free arm64 runners for
          # public repos — so no cross-compilation toolchain is involved.
          - runner: ubuntu-latest
            rid: linux-x64
          - runner: ubuntu-24.04-arm
            rid: linux-arm64
    runs-on: ${{ matrix.runner }}
    env:
      RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the built commit to be on main
        uses: ./.github/actions/require-on-main

      - name: Determine version
        uses: ./.github/actions/version
        with:
          version: ${{ inputs.version }}

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install NativeAOT prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang zlib1g-dev

      - name: Publish NativeAOT (${{ matrix.rid }})
        run: >
          dotnet publish src/PgNimbus.App -c Release -r "$RID"
          --self-contained true
          -p:PublishAot=true
          -p:Version="$VERSION"
          -p:FileVersion="$VERSION"
          -p:InformationalVersion="$VERSION"
          -o "publish/$RID"

      # appimagetool and the AppImage runtime it embeds are pinned releases
      # with sha256 checks inside the script — see scripts/linux/build-packages.sh.
      - name: Build tar.gz + AppImage + .deb
        run: |
          chmod +x scripts/linux/build-packages.sh
          ./scripts/linux/build-packages.sh "publish/$RID" "$VERSION" "$RID" dist

      - name: Install a virtual display
        run: sudo apt-get install -y xvfb

      # Each of the three Linux packages is launched the way its users will get
      # it. The .deb leg is the one that earns its runtime: apt resolves the
      # package's own Depends list, so a library the X11 backend loads but the
      # control file forgot fails here instead of on a user's machine.
      - name: Smoke test (all three packages)
        run: |
          chmod +x scripts/release/smoke-launch.sh
          arch="${RID#linux-}"
          base="pgNimbus-${VERSION}-linux-${arch}"

          ./scripts/release/smoke-launch.sh "publish output" "publish/${RID}/PgNimbus.App"

          tar -xzf "dist/${base}.tar.gz" -C "$RUNNER_TEMP"
          ./scripts/release/smoke-launch.sh "tar.gz" "$RUNNER_TEMP/${base}/PgNimbus.App"

          # CI runners have no FUSE, so the AppImage has to unpack itself —
          # the same flag build-packages.sh uses for appimagetool.
          chmod +x "dist/${base}.AppImage"
          ./scripts/release/smoke-launch.sh "AppImage" "dist/${base}.AppImage" --appimage-extract-and-run

          sudo apt-get install -y "./dist/${base}.deb"
          ./scripts/release/smoke-launch.sh ".deb" /usr/bin/pgnimbus
          sudo apt-get remove -y pgnimbus

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-packages-${{ matrix.rid }}
          path: dist/*
          # Same-run hand-off to "release" (see windows-zip above).
          retention-days: 1

      # The raw x64 publish output feeds the benchmark job so it doesn't
      # repeat the slow NativeAOT publish. Tarred because upload-artifact
      # zips files without their unix permissions — a bare upload would
      # deliver a non-executable binary to the startup probe.
      - name: Tar raw publish output (for benchmarks)
        if: matrix.rid == 'linux-x64'
        run: tar -C publish -czf publish-linux-x64.tar.gz linux-x64

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.rid == 'linux-x64'
        with:
          name: publish-linux-x64
          path: publish-linux-x64.tar.gz
          # Consumed by the benchmark job in this same run and by nothing else.
          retention-days: 1

  # Software bill of materials: every NuGet package (direct + transitive)
  # baked into the shipped app, as CycloneDX JSON. Its own job rather than a
  # step of the linux-x64 build leg (where it used to run, after the packages
  # were built): the SBOM tool is a third party, and this way it never shares a
  # runner with the binaries that ship. The NuGet dependency graph is
  # RID-independent, so one run is enough; -c Release matches the configuration
  # the release binaries are built in.
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the built commit to be on main
        uses: ./.github/actions/require-on-main

      - name: Determine version
        uses: ./.github/actions/version
        with:
          version: ${{ inputs.version }}

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # CycloneDX comes from the tool manifest (.config/dotnet-tools.json),
      # pinned to an exact version that Dependabot bumps.
      - name: Restore .NET tools (CycloneDX)
        run: dotnet tool restore

      - name: Generate SBOM (CycloneDX)
        run: |
          dotnet dotnet-CycloneDX src/PgNimbus.App/PgNimbus.App.csproj -c Release -F Json \
            -o sbom -fn "pgNimbus-${VERSION}-sbom.cdx.json" \
            -sn pgNimbus -sv "$VERSION" -ed

      # dotnet-CycloneDX only walks the NuGet graph, so the .NET runtime pack
      # a NativeAOT publish statically links in (GC, TLS and crypto code)
      # never shows up on its own. This job runs no publish, so the script
      # names the linux-x64 pack (the one build-linux's x64 leg links) and
      # reads its version from the runtime that setup-dotnet installed above,
      # which is the same pinned SDK the build legs use.
      - name: Add the .NET runtime pack to the SBOM
        run: |
          python3 scripts/release/sbom_add_runtime.py \
            "sbom/pgNimbus-${VERSION}-sbom.cdx.json" --rid linux-x64

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom/*.cdx.json
          # Same-run hand-off to "release" (see windows-zip above).
          retention-days: 1

  # The publish gate. Each build job smoke-launches its own artifacts before
  # uploading them, so "needs" already means "every package started and drew a
  # window" — a broken build cannot reach a GitHub Release without someone
  # deliberately re-running past a red job.
  release:
    needs: [build-windows, build-macos, build-linux, sbom]
    # A push of a v* tag, and nothing else: a workflow_dispatch started from a
    # tag has the same github.ref and must not publish.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For actions/attest-build-provenance (Sigstore signing via OIDC).
      id-token: write
      attestations: write
    steps:
      # Only the artifacts that ship in the Release. Notably excluded:
      # windows-msix (Store-submission-only, see build-windows),
      # publish-linux-x64 (benchmark input — its .tar.gz would otherwise
      # leak into the checksum globs below), bench-results.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
          pattern: "{windows-zip,macos-dmg-arm64,linux-packages-*,winget-manifests,sbom}"

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.dmg *.zip *.AppImage *.tar.gz *.deb *.cdx.json > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Signed SLSA build provenance (Sigstore) for every shipped file — the
      # $0 substitute for code signing on the direct-download channel: proves
      # a download was built by this workflow from this commit. Verify with:
      #   gh attestation verify <file> --repo Shman4ik/pgNimbus
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*

      # The preinstalled, first-party gh CLI rather than a third-party action:
      # this is the one step holding contents: write next to id-token: write,
      # and nothing outside GitHub's own tooling should run here.
      #
      # Deliberately create-only: a re-run after the release exists fails
      # instead of quietly replacing assets that may already have been
      # downloaded. Delete the release and re-run, or cut a new tag.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd artifacts
          # Every build is unsigned until a code-signing cert / Apple
          # Developer account is added — drop --prerelease once that lands.
          # An unmatched glob stays literal and fails the upload, which is
          # right: a missing package is a broken release, not a smaller one.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            --prerelease \
            ./*.dmg \
            ./*.zip \
            ./*.AppImage \
            ./*.tar.gz \
            ./*.deb \
            ./*.cdx.json \
            ./SHA256SUMS.txt
