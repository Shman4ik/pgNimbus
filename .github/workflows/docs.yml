name: Docs

# Builds the MkDocs site. Two jobs, and the split is the point: "build" runs on
# every event with a read-only token (--strict, so a broken link or a page
# missing from the nav fails the check); "publish" runs only for main, is the
# only job with contents: write, and pushes the built site to gh-pages under
# /docs/, leaving the landing page at the root and dev/bench/ untouched. A
# pull request never reaches a token that can write, whatever the build runs.
on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "scripts/website/publish-docs.sh"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "scripts/website/publish-docs.sh"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install MkDocs
        run: pip install -r docs/requirements.txt

      - name: Build
        run: mkdocs build --strict

  publish:
    needs: build
    # main only: a push to it, or a manual re-publish started from it. A pull
    # request or a dispatch from any other branch stops at "build".
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # publish-docs.sh adds a gh-pages worktree, which needs that branch
          # fetchable — a shallow single-branch clone can't provide it.
          fetch-depth: 0
          # The script pushes with git, so this is the one checkout that keeps
          # the token; the job's token is the only one with write access.
          persist-credentials: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install MkDocs
        run: pip install -r docs/requirements.txt

      # Builds again rather than downloading "build"'s output: the site is a
      # few seconds of mkdocs, and an artifact round-trip would cost storage
      # (CLAUDE.md, "Actions storage is a 0.5 GB budget") for nothing.
      - name: Build and publish to gh-pages
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: scripts/website/publish-docs.sh
