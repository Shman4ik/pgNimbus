# pgNimbus documentation site.
#
# Built with MkDocs Material and published to the gh-pages branch under /docs/
# by scripts/website/publish-docs.sh (which .github/workflows/docs.yml runs).
# The branch's root holds the hand-written landing page (website/index.html) and
# dev/bench/ holds the benchmark history — neither is touched by the docs build.
#
# Local preview:
#   pip install -r docs/requirements.txt
#   mkdocs serve

site_name: pgNimbus
site_description: >-
  Documentation for pgNimbus — a fast, open-source PostgreSQL GUI client with a
  modern, native UI.
site_url: https://shman4ik.github.io/pgNimbus/docs/
site_author: Dmitrii Shmanev
copyright: MIT licensed. Built with Avalonia and .NET.

repo_url: https://github.com/Shman4ik/pgNimbus
repo_name: Shman4ik/pgNimbus
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

# docs/ doubles as the repo's internal notes directory. Only the pages in `nav`
# below are published — everything here is working material that must not ship.
exclude_docs: |
  marketing/
  design/
  PROGRESS.md
  PRE-LAUNCH-CHECKLIST.md

theme:
  name: material
  language: en
  # Copied from design/masters/icon/ — that folder is the source of truth for
  # the brand marks; refresh these two if the masters change.
  logo: assets/logo.png
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Connecting to a database: getting-started/connecting.md
  - Guide:
      - SQL editor: guide/editor.md
      - Results grid: guide/results.md
      - Query plans: guide/explain.md
      - Monitoring: guide/monitoring.md
  - Reference:
      - Keyboard shortcuts: reference/keyboard-shortcuts.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Shman4ik/pgNimbus
      name: pgNimbus on GitHub
